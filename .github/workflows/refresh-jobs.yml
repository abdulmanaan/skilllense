name: Refresh job data

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call refresh endpoint
        run: |
          curl -f -X POST "${{ secrets.BACKEND_URL }}/api/admin/refresh-jobs" \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}"
